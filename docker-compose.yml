# Local / single-server deployment: PostgreSQL + Fashinza.
# Copy .env.example to .env and set the secrets first.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashinza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fashinza
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashinza"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: postgresql://fashinza:${POSTGRES_PASSWORD}@db:5432/fashinza
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fashinza:${POSTGRES_PASSWORD}@db:5432/fashinza
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
